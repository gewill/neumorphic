name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Print toolchain
        run: swift --version

      - name: Check whitespace
        run: git diff --check

      - name: Lint Swift formatting
        run: swift format lint --recursive --strict Package.swift Sources Tests neumorphic-examples/Shared

      - name: Run package tests
        run: swift test --scratch-path .build/macos

      - name: Build for minimum macOS version
        run: swift build --target Neumorphic --scratch-path .build/macos-minimum --sdk "$(xcrun --sdk macosx --show-sdk-path)" --triple x86_64-apple-macosx10.15

      - name: Build for iOS
        run: swift build --scratch-path .build/ios --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" --triple arm64-apple-ios13.0

      - name: Validate DocC catalog
        run: |
          docc_symbols_dir="${RUNNER_TEMP:?}/neumorphic-symbol-graphs"
          docc_archive_path="${RUNNER_TEMP:?}/Neumorphic.doccarchive"
          mkdir -p "$docc_symbols_dir"
          swift build --target Neumorphic --scratch-path .build/docc \
            -Xswiftc -emit-symbol-graph \
            -Xswiftc -emit-symbol-graph-dir \
            -Xswiftc "$docc_symbols_dir"
          xcrun docc convert Sources/Neumorphic/Neumorphic.docc \
            --additional-symbol-graph-dir "$docc_symbols_dir" \
            --fallback-display-name Neumorphic \
            --fallback-bundle-identifier com.gewill.neumorphic \
            --output-path "$docc_archive_path" \
            --warnings-as-errors

      - name: Swift 6 strict concurrency check
        run: swiftc -typecheck -swift-version 6 -strict-concurrency=complete -target arm64-apple-macosx14.0 -module-name Neumorphic Sources/Neumorphic/*.swift

      - name: Diagnose API breakages
        run: swift package diagnose-api-breaking-changes v2.1.0 --products Neumorphic
